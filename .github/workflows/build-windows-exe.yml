name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'scripts/build-exe.ps1'
      - 'service/**'
      - 'test/**'
      - 'run.js'
      - 'package.json'
      - 'config.example.json'
      - '.github/workflows/build-windows-exe.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and verify EXE
        shell: pwsh
        run: ./scripts/build-exe.ps1
      - name: Verify install, DPAPI, upgrade and management from a relocated EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Check-Exit($message) { if ($LASTEXITCODE -ne 0) { throw $message } }
          $exe = Join-Path (Get-Location) "dist/WFMicros.exe"
          & $exe init
          Check-Exit "Init failed"
          $config = Get-Content dist/config.json -Raw | ConvertFrom-Json
          foreach ($key in @("USERNAME_SELECTOR","PASSWORD_SELECTOR","SUBMIT_SELECTOR","BUTTON_IN_SELECTOR","BUTTON_OUT_SELECTOR")) { $config.environment.$key = "#unused" }
          $config.environment.LOGIN_URL = "http://127.0.0.1:9/"
          $config.environment.TARGET_URL = "http://127.0.0.1:9/attendance"
          $config.dashboard.port = 17846
          $config | ConvertTo-Json -Depth 20 | Set-Content dist/config.json
          '[{"username":"fixture-user","password":"fixture-not-real"}]' | Set-Content dist/accounts.local.json
          $day = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, "SE Asia Standard Time").ToString("yyyy-MM-dd")
          @{timezone="Asia/Ho_Chi_Minh";skipWeekends=$true;global=@($day);users=@{}} | ConvertTo-Json -Depth 10 | Set-Content dist/off_days.json
          try {
            & $exe install
            Check-Exit "Install failed"
            if ((Get-Content dist/accounts.local.json -Raw).Contains("fixture-not-real")) { throw "Plaintext password retained" }
            $protectedAccount = @(Get-Content dist/accounts.local.json -Raw | ConvertFrom-Json)[0]
            if ($protectedAccount.PSObject.Properties.Name -contains "username") { throw "Plaintext username retained" }
            if (!$protectedAccount.usernameProtected) { throw "Username was not protected" }
            # A second migration must preserve already encrypted values.
            & $exe protect-accounts
            Check-Exit "Repeated account protection failed"
            if ((Get-CimInstance Win32_Service -Filter "Name='PunchInOut'").DisplayName -ne "WFMicros") { throw "Service display name incorrect" }
            # Simulate the old release's display name, then verify upgrade renames it.
            sc.exe config PunchInOut DisplayName= "Punch In Out"
            Check-Exit "Legacy display name setup failed"
            $identityBefore = (Get-CimInstance Win32_Service -Filter "Name='PunchInOut'").StartName
            & $exe start
            Check-Exit "Start failed"
            function Wait-Dashboard {
              for ($i=0; $i -lt 30; $i++) {
                try { return Invoke-RestMethod http://127.0.0.1:17846/api/status } catch { Start-Sleep -Seconds 1 }
              }
              throw "Dashboard did not become available"
            }
            $status = Wait-Dashboard
            if (!$status.credentialsProtected) { throw "Credentials not protected" }
            if ($status.jobs.Where({$_.attempts -gt 0}).Count -gt 0) { throw "Unexpected attendance attempt" }
            New-Item build/relocated -ItemType Directory -Force | Out-Null
            Copy-Item $exe build/relocated/WFMicros.exe
            $relocated = Join-Path (Get-Location) "build/relocated/WFMicros.exe"
            & $relocated upgrade
            Check-Exit "Upgrade failed"
            if ((Get-CimInstance Win32_Service -Filter "Name='PunchInOut'").DisplayName -ne "WFMicros") { throw "Upgrade did not rename service" }
            $status = Wait-Dashboard
            if ((Get-CimInstance Win32_Service -Filter "Name='PunchInOut'").StartName -ne $identityBefore) { throw "Log On account changed" }
            if (!(Test-Path dist/data/state.json)) { throw "State not preserved" }
            & $relocated status
            Check-Exit "Relocated status failed"
            & $relocated stop
            Check-Exit "Relocated stop failed"
          } finally {
            & $exe uninstall
            Check-Exit "Uninstall failed"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: WFMicros-windows-x64
          path: |
            dist/WFMicros.exe
            dist/WFMicros.exe.sha256
          retention-days: 30

      - name: Upload dashboard UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dashboard-UI-previews
          path: build/qa/*.png
          if-no-files-found: ignore
          retention-days: 14

name: punch-in-out

on:
  workflow_dispatch:

concurrency:
  group: punch-in-out
  cancel-in-progress: true

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # CREATE VPN PROFILE
      # =========================================================
      - name: Create VPN profile
        shell: powershell
        env:
          VPN_SERVER: ${{ secrets.VPN_SERVER }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Creating VPN profile..."

          $existingVpn = Get-VpnConnection -Name "CLV" -ErrorAction SilentlyContinue

          if ($existingVpn) {
            Write-Host "VPN profile already exists. Removing..."
            Remove-VpnConnection -Name "CLV" -Force
          }

          Add-VpnConnection `
            -Name "CLV" `
            -ServerAddress "$env:VPN_SERVER" `
            -TunnelType Pptp `
            -AuthenticationMethod MSChapv2 `
            -EncryptionLevel Required `
            -RememberCredential `
            -Force

          Write-Host "VPN profile created."

          Get-VpnConnection -Name "CLV"

      # =========================================================
      # CONNECT VPN
      # =========================================================
      - name: Connect VPN
        shell: powershell
        env:
          VPN_USER: ${{ secrets.VPN_USER }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Connecting to CLV VPN..."

          $result = rasdial "CLV" "$env:VPN_USER" "$env:VPN_PASSWORD"

          Write-Host $result

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "===== VPN STATUS ====="

          $vpn = Get-VpnConnection -Name "CLV"

          Write-Host "Connection Status: $($vpn.ConnectionStatus)"

          if ($vpn.ConnectionStatus -ne "Connected") {
            Write-Host "VPN connection failed."
            exit 1
          }

          Write-Host ""
          Write-Host "===== IPCONFIG ====="
          ipconfig

          Write-Host ""
          Write-Host "===== ROUTES ====="
          route print

      # =========================================================
      # TEST TARGET
      # =========================================================
      - name: Test target through VPN
        shell: powershell
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Testing TARGET_URL through VPN..."
          Write-Host "URL: $env:TARGET_URL"

          try {
            $uri = [System.Uri]$env:TARGET_URL

            Write-Host ""
            Write-Host "===== DNS ====="

            Resolve-DnsName $uri.Host -ErrorAction Continue

            Write-Host ""
            Write-Host "===== CONNECTION TEST ====="

            $test = Test-NetConnection `
              -ComputerName $uri.Host `
              -Port 443

            Write-Host "RemoteAddress: $($test.RemoteAddress)"
            Write-Host "TcpTestSucceeded: $($test.TcpTestSucceeded)"

            if (-not $test.TcpTestSucceeded) {
              throw "Cannot connect to $($uri.Host):443"
            }

            Write-Host ""
            Write-Host "TARGET_URL is reachable through VPN."
          }
          catch {
            Write-Host ""
            Write-Host "Cannot reach TARGET_URL through VPN."
            Write-Host $_
            exit 1
          }

      # =========================================================
      # NODE
      # =========================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # =========================================================
      # INSTALL DEPENDENCIES
      # =========================================================
      - name: Install deps
        shell: powershell
        run: |
          npm ci

          npx playwright install chromium

      # =========================================================
      # DECIDE MODE
      # =========================================================
      - name: Decide mode
        shell: powershell
        run: |
          echo "MODE=OUT" >> $env:GITHUB_ENV

          Write-Host "MODE=OUT"

      # =========================================================
      # RUN BOT
      # =========================================================
      - name: Run bot
        shell: powershell
        env:
          MODE: ${{ env.MODE }}

          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          TARGET_URL: ${{ secrets.TARGET_URL }}

          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}

          USERNAME_SELECTOR: ${{ secrets.USERNAME_SELECTOR }}
          PASSWORD_SELECTOR: ${{ secrets.PASSWORD_SELECTOR }}
          SUBMIT_SELECTOR: ${{ secrets.SUBMIT_SELECTOR }}

          BUTTON_IN_SELECTOR: ${{ secrets.BUTTON_IN_SELECTOR }}
          BUTTON_OUT_SELECTOR: ${{ secrets.BUTTON_OUT_SELECTOR }}
        run: |
          Write-Host "Running bot..."
          Write-Host "Mode: $env:MODE"

          node run.js

      # =========================================================
      # UPLOAD DEBUG
      # =========================================================
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: |
            *.png
            debug.html
          if-no-files-found: ignore
          retention-days: 7

      # =========================================================
      # DISCONNECT VPN
      # =========================================================
      - name: Disconnect VPN
        if: always()
        shell: powershell
        run: |
          Write-Host "Disconnecting CLV VPN..."

          rasdial "CLV" /disconnect

          Start-Sleep -Seconds 2

          $vpn = Get-VpnConnection -Name "CLV" -ErrorAction SilentlyContinue

          if ($vpn) {
            Write-Host "Final VPN status: $($vpn.ConnectionStatus)"
          }

          Write-Host "VPN cleanup completed."
